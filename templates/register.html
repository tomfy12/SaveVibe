<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SaveVibe.com</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        .auth-card {
            background: #17181c;
            max-width: 400px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            border-top: 5px solid #ffcc00;
        }
        .auth-card h1 { color: #fff; margin-bottom: 20px; font-size: 24px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
        .btn-auth { background: #ffcc00; color: #000; font-weight: 600; padding: 12px; width: 100%; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-auth:hover { background: #e6b800; transform: scale(1.02); }
        .auth-links { margin-top: 15px; font-size: 14px; }
        .auth-links a { color: #ffcc00; text-decoration: none; }
        .auth-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="/" class="logo-link">
                <span class="logo-yellow">Save</span><span class="logo-white">Vibe.com</span>
            </a>
        </div>
        <div class="nav-menu">
            <a href="/">Home</a>
            <a href="/about">About Us</a>
            <a href="/contact">Contact Us</a>
            <a href="/login">Login</a>
        </div>
    </nav>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="container" style="margin-top: 20px;">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" style="text-align: center; padding: 12px; border-radius: 6px; background: {% if category == 'success' %}#2ed573{% elif category == 'info' %}#1e90ff{% else %}#ff3333{% endif %}; color: white; font-weight: 500;">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="container">
        <div class="auth-card">
            <h1><i class="fas fa-user-plus"></i> Register</h1>
            <form action="{{ url_for('register') }}" method="POST">
                <div class="form-group">
                    <input type="text" name="username" class="form-input" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" class="form-input" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" class="form-input" placeholder="Password (Min 8 Chars)" required minlength="8">
                </div>
                <div class="form-group">
                    <input type="password" name="confirm_password" class="form-input" placeholder="Confirm Password" required minlength="8">
                </div>
                <button type="submit" class="btn-auth">Create Account</button>
            </form>
            <div class="auth-links">
                <p style="color: #bbb;">Already have an account? <a href="/login">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
