<!-- Navbar Profile Dropdown -->
<div class="profile-dropdown-container" id="profileDropdownContainer">
    <div class="nav-avatar" onclick="toggleProfileDropdown()">
        {{ session.get('username')[0].upper() }}
    </div>
    <div class="profile-dropdown-menu" id="profileDropdownMenu">
        <div class="dropdown-header">
            <div class="dropdown-avatar">{{ session.get('username')[0].upper() }}</div>
            <div class="dropdown-user-info">
                <h4>{{ session.get('username') }}</h4>
                <p>{{ session.get('email', 'No email') }}</p>
                <span class="role-badge">{{ session.get('role', 'user') | capitalize }}</span>
            </div>
        </div>
        <div class="dropdown-divider"></div>
        <ul class="dropdown-links">
            <li><a href="/profile"><i class="fas fa-user"></i> My Profile</a></li>
            <li><a href="/profile"><i class="fas fa-history"></i> Download History</a></li>
            <li><a href="javascript:void(0)" class="disabled-link"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
        <div class="dropdown-divider"></div>
        <a href="/logout" class="dropdown-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</div>

<script>
    function toggleProfileDropdown() {
        const menu = document.getElementById('profileDropdownMenu');
        menu.classList.toggle('active');
    }

    // Close when clicking outside
    document.addEventListener('click', function(event) {
        const container = document.getElementById('profileDropdownContainer');
        const menu = document.getElementById('profileDropdownMenu');
        if (container && menu && !container.contains(event.target)) {
            menu.classList.remove('active');
        }
    });

    // Close on Escape key
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            const menu = document.getElementById('profileDropdownMenu');
            if (menu && menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        }
    });
</script>
