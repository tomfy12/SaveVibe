<header id="navbar-section" class="navbar-section">
    <nav class="navbar">
        <div class="logo">
            <a href="/" class="logo-link">
                <span class="logo-yellow">Save</span><span class="logo-white">Vibe.com</span>
            </a>
        </div>
        <button class="mobile-menu-toggle" onclick="document.getElementById('navMenu').classList.toggle('active')">
            <i class="fas fa-bars"></i>
        </button>
        <div class="nav-menu" id="navMenu">
            <a href="/" class="active">Home</a>
            <a href="{{ url_for('about') }}">About Us</a>
            <a href="{{ url_for('contact') }}">Contact Us</a>
            {% if session.get('user_id') %}

                {% include '_navbar_profile.html' %}
            {% else %}
                <div class="auth-buttons">
                    <a href="javascript:void(0)" class="btn-login" onclick="openAuthModal('login')">Login</a>
                    <a href="javascript:void(0)" class="btn-signup" onclick="openAuthModal('signup')">Sign Up</a>
                </div>
            {% endif %}
        </div>
    </nav>
</header>
