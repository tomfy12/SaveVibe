services:
  - type: web
    name: savevibe-youtube-downloader
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: savevibe-data
      mountPath: /data
      sizeGB: 1
